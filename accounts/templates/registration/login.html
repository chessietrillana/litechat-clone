{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <div class="form-card">
    <h1>Log in</h1>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="field">
          {{ field.label_tag }}
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
{% endblock %}
