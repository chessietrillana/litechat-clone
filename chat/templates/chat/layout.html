{% extends "base.html" %}

{% block body_class %}chat-page{% endblock %}

{% block main %}
  <div class="chat-app">
    <aside class="sidebar" aria-label="Your chats">
      <a class="button new-chat" href="{% url 'home' %}">New chat</a>
      {% if sessions %}
        <ul class="session-list">
          {% for s in sessions %}
            <li>
              <a href="{% url 'chat_session' s.pk %}"
                 class="session-link{% if s.pk == current_session.pk %} current{% endif %}"
                 {% if s.pk == current_session.pk %}aria-current="page"{% endif %}>{{ s.title }}</a>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p class="empty">No chats yet.</p>
      {% endif %}
    </aside>

    <main class="chat-main">
      {% include "_messages.html" %}
      {% block chat %}{% endblock %}
    </main>
  </div>
{% endblock %}
